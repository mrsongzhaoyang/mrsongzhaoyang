name: Refresh profile stats

on:
  schedule:
    - cron: "17 3 * * *"      # 每天 03:17 UTC（北京时间 11:17）刷新一次
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/gen_stats.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets)" ]; then
            git add assets/stats.svg assets/langs.svg
            git commit -m "chore(stats): refresh profile cards"
            git push
            echo "updated"
          else
            echo "nothing changed"
          fi
