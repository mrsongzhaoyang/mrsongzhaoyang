<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150"
     viewBox="0 0 1000 150" fill="none" role="img" aria-label="语言构成">
  <title>语言构成</title>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1000" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2136"/>
      <stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <clipPath id="lclip"><rect width="1000" height="150" rx="18"/></clipPath>
    <clipPath id="track"><rect x="34" y="60" width="932" height="16" rx="8"/></clipPath>
    <style>
      .ink { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, 'PingFang SC', monospace; }
    </style>
  </defs>

  <g clip-path="url(#lclip)">
    <rect width="1000" height="150" fill="url(#lbg)"/>
    <circle cx="960" cy="10" r="88" fill="#12B7F5" fill-opacity="0.05"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="148.5" rx="17.25"
        stroke="#1E3A5F" stroke-opacity="0.85" stroke-width="1.5"/>

  <text class="mono" x="34" y="40" font-size="11.5" letter-spacing="2.2"
        fill="#D4AF37" fill-opacity="0.85">LANGUAGES / 语言构成</text>
  <text class="mono" x="966" y="40" text-anchor="end" font-size="11.5"
        fill="#8FA6BE" fill-opacity="0.8">≈ 1,168 KB of code</text>

  <g clip-path="url(#track)">
    <rect x="34" y="60" width="932" height="16" fill="#12293F"/>
  <rect x="34.0" y="60" width="382.4" height="16" fill="#FFD93D"/>
  <rect x="416.4" y="60" width="222.4" height="16" fill="#FF9F1C"/>
  <rect x="638.8" y="60" width="127.1" height="16" fill="#12B7F5"/>
  <rect x="765.8" y="60" width="79.7" height="16" fill="#2DD4BF"/>
  <rect x="845.5" y="60" width="56.1" height="16" fill="#A78BFA"/>
  <rect x="901.6" y="60" width="64.4" height="16" fill="#64748B"/>
  </g>

  <g>
