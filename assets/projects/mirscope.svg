  <text class="ink" x="34" y="70" font-size="26" font-weight="700"
        fill="#E8EEF6">Mirscope</text>

  <text class="ink" x="34" y="99" font-size="15" fill="#A9BCCE">本地优先的 AI Prompt 全景分析平台，对话数据默认不出本机</text>
  <g>
    <rect x="34.0" y="113" width="94.5" height="25" rx="12.5"
