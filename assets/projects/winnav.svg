<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158"
     viewBox="0 0 1000 158" fill="none" role="img" aria-label="WinNav">
  <title>WinNav — WinNav</title>
  <defs>
    <linearGradient id="card3" x1="0" y1="0" x2="1000" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2136"/>
      <stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9F1C" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF9F1C" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="clip3">
      <rect width="1000" height="158" rx="18"/>
    </clipPath>
    <style>
      .ink { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, 'PingFang SC', monospace; }
    </style>
  </defs>

  <g clip-path="url(#clip3)">
    <rect width="1000" height="158" fill="url(#card3)"/>
    <rect x="0" y="0" width="5" height="158" fill="url(#bar3)"/>
    <circle cx="966" cy="4" r="86" fill="#FF9F1C" fill-opacity="0.07"/>
    <text class="mono" x="986" y="145" text-anchor="end" font-size="116" font-weight="700"
