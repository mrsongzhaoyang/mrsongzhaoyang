<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158"
     viewBox="0 0 1000 158" fill="none" role="img" aria-label="垂钓鸭">
  <title>垂钓鸭 — ChuiDuck</title>
  <defs>
    <linearGradient id="card1" x1="0" y1="0" x2="1000" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2136"/>
      <stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD93D" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD93D" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="clip1">
      <rect width="1000" height="158" rx="18"/>
    </clipPath>
    <style>
      .ink { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, 'PingFang SC', monospace; }
    </style>
  </defs>

  <g clip-path="url(#clip1)">
    <rect width="1000" height="158" fill="url(#card1)"/>
    <rect x="0" y="0" width="5" height="158" fill="url(#bar1)"/>
    <circle cx="966" cy="4" r="86" fill="#FFD93D" fill-opacity="0.07"/>
    <text class="mono" x="986" y="145" text-anchor="end" font-size="116" font-weight="700"
          fill="#FFFFFF" fill-opacity="0.035">01</text>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="156.5" rx="17.25"
        stroke="#1E3A5F" stroke-opacity="0.85" stroke-width="1.5"/>

  <text class="mono" x="34" y="36" font-size="11.5" letter-spacing="2.4"
        fill="#FFD93D" fill-opacity="0.8">PROJECT 01</text>

  <text class="ink" x="34" y="70" font-size="26" font-weight="700"
        fill="#E8EEF6">垂钓鸭</text>
  <text class="mono" x="124.0" y="70" font-size="13.5" fill="#8FA6BE" fill-opacity="0.85" letter-spacing="0.5">ChuiDuck</text>

  <text class="ink" x="34" y="99" font-size="15" fill="#A9BCCE">在网页世界里垂钓数据：选技能包 → 建任务 → 自动执行 → 导出结果</text>
  <g>
    <rect x="34.0" y="113" width="94.5" height="25" rx="12.5"
          fill="#FFD93D" fill-opacity="0.09" stroke="#FFD93D" stroke-opacity="0.30"/>
    <text class="mono" x="45.0" y="130" font-size="12.5"
          fill="#FFD93D" fill-opacity="0.92">TypeScript</text>
  </g>
  <g>
    <rect x="137.5" y="113" width="80.0" height="25" rx="12.5"
          fill="#FFD93D" fill-opacity="0.09" stroke="#FFD93D" stroke-opacity="0.30"/>
    <text class="mono" x="148.5" y="130" font-size="12.5"
          fill="#FFD93D" fill-opacity="0.92">Electron</text>
  </g>
  <g>
    <rect x="226.5" y="113" width="58.2" height="25" rx="12.5"
          fill="#FFD93D" fill-opacity="0.09" stroke="#FFD93D" stroke-opacity="0.30"/>
    <text class="mono" x="237.5" y="130" font-size="12.5"
          fill="#FFD93D" fill-opacity="0.92">Vue 3</text>
  </g>
  <g>
    <rect x="293.8" y="113" width="65.5" height="25" rx="12.5"
          fill="#FFD93D" fill-opacity="0.09" stroke="#FFD93D" stroke-opacity="0.30"/>
    <text class="mono" x="304.8" y="130" font-size="12.5"
          fill="#FFD93D" fill-opacity="0.92">SQLite</text>
  </g>
  <g>
    <circle cx="900" cy="70" r="17" fill="#FFD93D" fill-opacity="0.08" stroke="#D4AF37" stroke-opacity="0.35"/>
    <text class="mono" x="900" y="75" text-anchor="middle" font-size="12.5"
          fill="#FFD93D">2★</text>
  </g>
  <g>
    <circle cx="952" cy="79" r="18" fill="#0F2438" stroke="#1E3A5F"/>
    <text x="952" y="86" text-anchor="middle" font-size="16" fill="#FFD93D">↗</text>
  </g>
</svg>
