<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="158"
     viewBox="0 0 1000 158" fill="none" role="img" aria-label="DeepForge">
  <title>DeepForge — deepforge</title>
  <defs>
    <linearGradient id="card4" x1="0" y1="0" x2="1000" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2136"/>
      <stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="clip4">
      <rect width="1000" height="158" rx="18"/>
    </clipPath>
    <style>
      .ink { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Menlo, Consolas, 'PingFang SC', monospace; }
    </style>
  </defs>

  <g clip-path="url(#clip4)">
    <rect width="1000" height="158" fill="url(#card4)"/>
    <rect x="0" y="0" width="5" height="158" fill="url(#bar4)"/>
    <circle cx="966" cy="4" r="86" fill="#7DD3FC" fill-opacity="0.07"/>
    <text class="mono" x="986" y="145" text-anchor="end" font-size="116" font-weight="700"
          fill="#FFFFFF" fill-opacity="0.035">04</text>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="156.5" rx="17.25"
        stroke="#1E3A5F" stroke-opacity="0.85" stroke-width="1.5"/>

  <text class="mono" x="34" y="36" font-size="11.5" letter-spacing="2.4"
        fill="#7DD3FC" fill-opacity="0.8">PROJECT 04</text>

  <text class="ink" x="34" y="70" font-size="26" font-weight="700"
        fill="#E8EEF6">DeepForge</text>

  <text class="ink" x="34" y="99" font-size="15" fill="#A9BCCE">沙盘推演，模拟预策事情走向 —— 动手之前先把事情走一遍</text>
  <g>
    <rect x="34.0" y="113" width="58.2" height="25" rx="12.5"
          fill="#7DD3FC" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.30"/>
    <text class="mono" x="45.0" y="130" font-size="12.5"
          fill="#7DD3FC" fill-opacity="0.92">Batch</text>
  </g>
  <g>
    <rect x="101.2" y="113" width="94.5" height="25" rx="12.5"
          fill="#7DD3FC" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.30"/>
    <text class="mono" x="112.2" y="130" font-size="12.5"
          fill="#7DD3FC" fill-opacity="0.92">Simulation</text>
  </g>
  <g>
    <circle cx="952" cy="79" r="18" fill="#0F2438" stroke="#1E3A5F"/>
    <text x="952" y="86" text-anchor="middle" font-size="16" fill="#7DD3FC">↗</text>
  </g>
</svg>
